<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Страница не найдена</title>

    <!-- CSS
    ================================================== -->
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/media.css" />

    <!-- favicons
    ================================================== -->
    <link
      rel="apple-touch-icon"
      type="image/svg+xml"
      sizes="180x180"
      href="images/icons/favicon.svg"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="32x32"
      href="images/icons/favicon.svg"
    />
    <link
      rel="icon"
      type="image/svg+xmlpng"
      sizes="16x16"
      href="images/icons/favicon.svg"
    />
  </head>
  <body>
    <!-- preloader
    ================================================== -->
    <div id="preloader">
      <div id="loader" class="dots-fade">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>

    <!-- page wrap
    ================================================== -->
    <div id="page" class="s-pagewrap">
      <section class="s-404">
        <div class="container">
          <div class="error-404">
            <!-- Текстовая часть -->
            <div class="error-404__content">
              <div class="error-404__number">
                <span>4</span>
                <span class="error-404__zero">0</span>
                <span>4</span>
              </div>

              <h1 class="error-404__title">Страница не найдена</h1>

              <p class="error-404__text">
                Возможно, она была удалена, переименована или никогда не
                существовала.
              </p>

              <div class="error-404__btn">
                <a class="btn" href="./">Вернуться на главную</a>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <!-- end page-wrap -->
    <script src="js/main.js"></script>
  </body>
</html>
